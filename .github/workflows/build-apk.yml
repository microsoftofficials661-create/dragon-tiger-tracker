name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK with Cordova
        run: |
          npm install -g cordova
          cordova create app com.dragon.tigertracker "DragonTigerTracker"
          cd app
          rm -rf www/*
          cp ../index.html ../manifest.json ../sw.js www/
          cordova platform add android --save
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DragonTigerTracker-APK
          path: app/platforms/android/app/build/outputs/apk/debug/*.apk
