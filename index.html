<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dragon Tiger Card Tracker</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0d0f12; color: #ffffff; padding: 16px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .title-box h1 { font-size: 18px; font-weight: 800; color: #e50914; letter-spacing: 1px; }
    .title-box p { font-size: 11px; color: #888; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 700; cursor: pointer; }
    .badge.normal { background: #262930; color: #ff9800; border: 1px solid #ff9800; }
    .badge.pro-active { background: #ff9800; color: #000; border: none; }
    .dashboard { width: 100%; max-width: 400px; background: #161920; border-radius: 12px; padding: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; border: 1px solid #262930; }
    .stat-card { background: #1f232d; border-radius: 8px; padding: 10px; text-align: center; }
    .stat-label { font-size: 10px; color: #888; margin-bottom: 4px; }
    .stat-val { font-size: 14px; font-weight: 700; }
    .val-green { color: #00e676; }
    .prediction-box { width: 100%; max-width: 400px; background: #161920; border-radius: 12px; padding: 16px; text-align: center; margin-bottom: 20px; border: 1px solid #262930; }
    .pred-title { font-size: 12px; color: #888; margin-bottom: 8px; }
    .pred-result { font-size: 24px; font-weight: 900; letter-spacing: 1px; color: #ffeb3b; }
    .actions-grid { width: 100%; max-width: 400px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .btn { border: none; border-radius: 10px; padding: 14px 0; font-size: 15px; font-weight: 800; cursor: pointer; color: #fff; }
    .btn-dragon { background: #e50914; }
    .btn-tiger { background: #ff9800; }
    .btn-tie { width: 100%; max-width: 400px; background: #00e676; margin-bottom: 20px; }
    .btn-reset { width: 100%; max-width: 400px; background: transparent; border: 1px solid #333; color: #777; font-size: 12px; padding: 8px; border-radius: 6px; cursor: pointer; }
    
    /* Paywall Modal */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
    .modal-content { background: #161920; border-radius: 16px; padding: 20px; width: 100%; max-width: 360px; text-align: center; position: relative; border: 1px solid #ff9800; }
    .modal-close { position: absolute; top: 12px; right: 14px; font-size: 20px; color: #ff9800; cursor: pointer; }
    .qr-box { margin: 12px auto; width: 170px; height: 170px; background: #fff; padding: 6px; border-radius: 8px; }
    .qr-box img { width: 100%; height: 100%; display: block; }
    .pay-btn { display: block; width: 100%; background: #e50914; color: #fff; text-decoration: none; padding: 10px; font-weight: bold; border-radius: 8px; margin-bottom: 12px; font-size: 13px; }
    .input-field { width: 100%; padding: 10px; background: #222631; border: 1px solid #333a4d; color: #fff; border-radius: 6px; margin-bottom: 10px; text-align: center; font-size: 13px; }
    .submit-btn { width: 100%; padding: 12px; background: #00e676; color: #000; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="title-box">
      <p>WELCOME BACK</p>
      <h1>MOHAN</h1>
      <p>Dragon Tiger Colour Card Tracker</p>
    </div>
    <div id="modeBadge" class="badge normal" onclick="openPaywall()">NORMAL</div>
  </div>

  <div class="dashboard">
    <div class="stat-card">
      <div class="stat-label">Level / Step</div>
      <div id="statLevel" class="stat-val">Level 1 of 8</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total P&L</div>
      <div id="statPnl" class="stat-val val-green">₹0.00</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Next Bet</div>
      <div id="statBet" class="stat-val">₹10</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Recommendation</div>
      <div id="statSignal" class="stat-val" style="color:#ff9800;">WAIT</div>
    </div>
  </div>

  <div class="prediction-box">
    <div class="pred-title">AI PATTERN PREDICTION</div>
    <div id="predResult" class="pred-result">DRAGON</div>
  </div>

  <div class="actions-grid">
    <button class="btn btn-dragon" onclick="recordGame('DRAGON')">DRAGON</button>
    <button class="btn btn-tiger" onclick="recordGame('TIGER')">TIGER</button>
  </div>
  <button class="btn btn-tie" onclick="recordGame('TIE')">TIE</button>
  <button class="btn-reset" onclick="resetTracker()">RESET DATA</button>

  <!-- Modal -->
  <div id="paywallModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-close" onclick="closePaywall()">✕</div>
      <h3 style="color:#ff9800;font-size:15px;margin-bottom:4px;">UPGRADE TO PRO EDITION</h3>
      <p style="font-size:11px;color:#aaa;margin-bottom:10px;">Pay ₹299 for Pro Table & 10 Levels Backup</p>
      <div class="qr-box">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=konala@superyes%26pn=Mohan%26am=299%26cu=INR" alt="QR Code">
      </div>
      <p style="font-size:11px;color:#888;margin-bottom:10px;">UPI: konala@superyes</p>
      <a class="pay-btn" href="upi://pay?pa=konala@superyes&pn=Mohan&am=299&cu=INR">PAY ₹299 (OPEN UPI APP)</a>
      <input type="text" id="utrInput" class="input-field" placeholder="Enter 12-digit UTR or Activation Code">
      <button id="submitBtn" class="submit-btn" onclick="verifyUTR()">SUBMIT UTR TO UNLOCK</button>
    </div>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const BOT_TOKEN = "9214949604:AAHfN-q4KpDl6sSyNlWac5HBTNYyw15ksBA";
    const ADMIN_CHAT_ID = "7471483619";

    let history = [];
    let currentLevel = 1;
    let totalPnl = 0;
    let isPro = localStorage.getItem("dt_pro_unlocked") === "true";

    const betsNormal = [10, 20, 40, 80, 160, 320, 640, 1280];
    const betsPro = [10, 20, 40, 80, 160, 320, 640, 1280, 2560, 5120];

    function applyProStatus() {
      if (isPro) {
        const badge = document.getElementById("modeBadge");
        if (badge) {
          badge.innerText = "PRO EDITION";
          badge.className = "badge pro-active";
        }
      }
      updateUI();
    }

    function recordGame(result) {
      history.push(result);
      if (history.length > 50) history.shift();

      const lastPred = document.getElementById("predResult").innerText;
      const currentBets = isPro ? betsPro : betsNormal;
      const betAmount = currentBets[currentLevel - 1] || currentBets[0];

      if (result !== "TIE") {
        if (result === lastPred) {
          totalPnl += betAmount;
          currentLevel = 1;
        } else {
          totalPnl -= betAmount;
          currentLevel = (currentLevel >= currentBets.length) ? 1 : currentLevel + 1;
        }
      }

      updateUI();
    }

    function updateUI() {
      const currentBets = isPro ? betsPro : betsNormal;
      const maxLevels = currentBets.length;
      
      document.getElementById("statLevel").innerText = `Level ${currentLevel} of ${maxLevels}`;
      document.getElementById("statBet").innerText = `₹${currentBets[currentLevel - 1] || currentBets[0]}`;
      
      const pnlEl = document.getElementById("statPnl");
      pnlEl.innerText = `${totalPnl >= 0 ? "+" : ""}₹${totalPnl.toFixed(2)}`;
      pnlEl.className = totalPnl >= 0 ? "stat-val val-green" : "stat-val";
      if (totalPnl < 0) pnlEl.style.color = "#e50914";

      // Prediction algorithm
      let nextPred = "DRAGON";
      if (history.length > 0) {
        const dCount = history.filter(x => x === "DRAGON").length;
        const tCount = history.filter(x => x === "TIGER").length;
        nextPred = dCount > tCount ? "TIGER" : "DRAGON";
      }
      document.getElementById("predResult").innerText = nextPred;
      document.getElementById("statSignal").innerText = "BET NOW";
    }

    function resetTracker() {
      history = [];
      currentLevel = 1;
      totalPnl = 0;
      updateUI();
    }

    function openPaywall() {
      if (isPro) {
        alert("You are already on PRO EDITION!");
        return;
      }
      document.getElementById("paywallModal").style.display = "flex";
    }

    function closePaywall() {
      document.getElementById("paywallModal").style.display = "none";
    }

    async function verifyUTR() {
      const input = (document.getElementById("utrInput").value || "").trim();

      if (!input) {
        alert("Please enter your UTR number or secret key.");
        return;
      }

      // 1. Secret key unlocks directly
      if (input.toLowerCase() === "reddy" || input.toLowerCase() === "mohan") {
        localStorage.setItem("dt_pro_unlocked", "true");
        isPro = true;
        applyProStatus();
        closePaywall();
        alert("Pro Edition successfully unlocked!");
        return;
      }

      if (input.length < 8) {
        alert("Please enter a valid 12-digit UTR.");
        return;
      }

      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.innerText = "Submitting...";

      let tgUser = "Unknown (Browser Session)";
      let tgId = "Browser Session";

      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
        const u = window.Telegram.WebApp.initDataUnsafe.user;
        tgUser = (u.first_name || "") + (u.last_name ? " " + u.last_name : "");
        if (u.username) tgUser += " (@" + u.username + ")";
        tgId = u.id;
      }

      const text = `💰 NEW PAYMENT RECEIVED\n\n👤 User: ${tgUser}\n🆔 Telegram ID: ${tgId}\n🔢 UTR Number: ${input}\n💵 Amount: ₹299\n\nPlease check your PhonePe/GPay app to verify.`;

      const replyMarkup = {
        inline_keyboard: [
          [
            { text: "✅ Approve (Send Key)", url: "https://t.me/share/url?url=Payment%20Approved!%20Your%20Pro%20Unlock%20Passcode%20is:%20Reddy" },
            { text: "❌ Reject", url: "https://t.me/share/url?url=Payment%20Verification%20Failed.%20Invalid%20UTR." }
          ]
        ]
      };

      try {
        const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: ADMIN_CHAT_ID,
            text: text,
            reply_markup: replyMarkup
          })
        });

        const data = await res.json();
        if (data.ok) {
          alert("UTR submitted! Once verified, enter code Reddy into this box to unlock.");
          closePaywall();
        } else {
          alert("Submission error: " + (data.description || "Try again"));
        }
      } catch (err) {
        alert("Network error. Please try again.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "SUBMIT UTR TO UNLOCK";
      }
    }

    applyProStatus();
  </script>
</body>
</html>
